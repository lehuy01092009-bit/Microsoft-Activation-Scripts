name = "mas-htchuai"
main = "worker.js"
compatibility_date = "2024-11-01"

# Ghim san account -> `wrangler deploy` khong hoi chon account khi dang nhap
# bang nhieu tai khoan Cloudflare.
account_id = "6783d1be06b99f51d37827642c3615b6"

# ============================================================================
#  ⚠️⚠️ TUYỆT ĐỐI KHÔNG dùng pattern "htchuai.dpdns.org/*"
#
#  Route đó NUỐT CẢ DOMAIN -> worker mas-htchuai sẽ trả lời mọi path và
#  website well-known (dash.php, /tx/, /tx/admin/, /edit/, /admin/dashboard...)
#  CHẾT NGAY. (Lỗi này đã từng xảy ra, phải chạy fix-mas-route.ps1 để cứu.)
#
#  Chỉ 5 path dưới đây thuộc worker. Mọi path khác rơi xuống tunnel
#  (cloudflared -> localhost:8090 -> Apache -> well-known).
#
#  ⚠️ `/office` CỐ Ý KHÔNG có route ở đây — nó do well-known phục vụ
#     (`function/mas/office.php`). Nếu thêm route /office thì worker sẽ
#     "che" mất bản của well-known. Xem DEPLOY.md.
#
#  ⚠️ Danh sách này PHẢI ĐỒNG BỘ với $wanted trong
#     %LOCALAPPDATA%\PhpStack\fix-mas-route.ps1
#     (script đó XOÁ mọi route không nằm trong $wanted).
# ============================================================================
routes = [
  { pattern = "htchuai.dpdns.org/get",         zone_name = "htchuai.dpdns.org" },
  { pattern = "htchuai.dpdns.org/aio",         zone_name = "htchuai.dpdns.org" },
  { pattern = "htchuai.dpdns.org/zip",         zone_name = "htchuai.dpdns.org" },
  { pattern = "htchuai.dpdns.org/MAS_AIO.cmd", zone_name = "htchuai.dpdns.org" },
  { pattern = "htchuai.dpdns.org/pkg",         zone_name = "htchuai.dpdns.org" },
]

[observability]
enabled = true
